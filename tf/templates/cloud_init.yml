#cloud-config
hostname: crossland
fqdn: cross.land
users:
  - name: cross
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, sudo
    home: /home/cross
    shell: /bin/bash
    lock_passwd: false
    ssh-authorized-keys:
      - ssh-rsa 
ssh_pwauth: true
chpasswd:
  list: |
     toto:toto
  expire: False

package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - wget https://github.com/elisescu/tty-share/releases/download/v2.4.1/tty-share_linux-amd64 -O /usr/local/bin/tty-share
  - chmod +x /usr/local/bin/tty-share